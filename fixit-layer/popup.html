<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixIt Layer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #1a1a2e;
    }

    .header {
      padding: 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .header p {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 4px;
    }

    .actions {
      padding: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 4px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #1a1a2e;
      transition: background 0.1s, border-color 0.1s;
      text-align: left;
    }

    .btn:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }

    .btn.active {
      background: #eef2ff;
      border-color: #6366f1;
      color: #6366f1;
    }

    .btn.reset {
      color: #dc2626;
      border-color: #fecaca;
    }

    .btn.reset:hover {
      background: #fef2f2;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .footer {
      padding: 8px 16px 12px;
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FixIt Layer</h1>
    <p>Remove distractions, improve readability</p>
  </div>

  <div class="actions">
    <button class="btn" data-action="fix">
      <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
      Fix this page
    </button>
    <button class="btn" data-action="clean">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      Clean mode
    </button>
    <button class="btn" data-action="focus">
      <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      Focus mode
    </button>
    <button class="btn" data-action="dark">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      Dark background
    </button>
    <button class="btn reset" data-action="reset">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      Reset page
    </button>
  </div>

  <div class="footer">Use the floating button on any page</div>

  <script src="popup.js"></script>
</body>
</html>
