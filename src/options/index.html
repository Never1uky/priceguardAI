<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PriceGuard AI — Настройки</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
        padding: 2rem 1.5rem;
        max-width: 42rem;
        background: #fafafa;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f0f0f;
          color: #eee;
        }
        a {
          color: #7cb3ff;
        }
        .card {
          background: #1a1a1a;
          border-color: #333;
        }
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.25rem;
      }
      .muted {
        color: #666;
        font-size: 0.9rem;
      }
      @media (prefers-color-scheme: dark) {
        .muted {
          color: #aaa;
        }
      }
      .card {
        margin-top: 1.25rem;
        padding: 1rem 1.25rem;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        background: #fff;
      }
      ul {
        padding-left: 1.2rem;
        margin: 0.75rem 0 0;
      }
      li + li {
        margin-top: 0.5rem;
      }
      a {
        color: #2563eb;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <h1>PriceGuard AI</h1>
    <p class="muted" id="version">Версия …</p>

    <div class="card">
      <strong>Настройки расширения</strong>
      <p class="muted" style="margin: 0.5rem 0 0">
        Уведомления, Telegram, тема и подписка — во всплывающем окне расширения (иконка в панели Chrome) на вкладке «Настройки».
      </p>
    </div>

    <div class="card">
      <strong>Полезные ссылки</strong>
      <ul>
        <li>
          <a
            href="https://chromewebstore.google.com/detail/priceguard-ai/ipaichogganccpnapdgkjldplllnjlpf"
            target="_blank"
            rel="noopener noreferrer"
            >Chrome Web Store</a
          >
        </li>
        <li>
          <a href="https://t.me/PriceGuardAlertsBot" target="_blank" rel="noopener noreferrer"
            >Telegram: @PriceGuardAlertsBot</a
          >
        </li>
        <li>
          <a href="https://t.me/priceguard_supportbot" target="_blank" rel="noopener noreferrer"
            >Поддержка: @priceguard_supportbot</a
          >
        </li>
      </ul>
    </div>

    <script type="module">
      const manifest = chrome.runtime.getManifest();
      document.getElementById('version').textContent = `Версия ${manifest.version}`;
    </script>
  </body>
</html>
