# Backup trigger for server-side Telegram price checks.
# Primary schedule: pg_cron '0 */6 * * *' via supabase/scripts/setup-update-prices-cron.sql
# This workflow is intentionally staggered (+20m) so GH is a real backup, not a duplicate.
#
# Repo secrets:
#   SUPABASE_URL              e.g. https://ihlfvpocwobvcpxbypsd.supabase.co
#   UPDATE_PRICES_CRON_SECRET same as Edge Function secret

name: update-prices

on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call update-prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          UPDATE_PRICES_CRON_SECRET: ${{ secrets.UPDATE_PRICES_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${UPDATE_PRICES_CRON_SECRET:-}" ]; then
            echo "Missing SUPABASE_URL or UPDATE_PRICES_CRON_SECRET secrets"
            exit 1
          fi
          BASE="${SUPABASE_URL%/}"
          HTTP_CODE="$(curl -sS -X POST "${BASE}/functions/v1/update-prices" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${UPDATE_PRICES_CRON_SECRET}" \
            -d '{}' \
            -o /tmp/update-prices.json \
            -w "%{http_code}")"
          echo "HTTP status: ${HTTP_CODE}"
          cat /tmp/update-prices.json || true
          HTTP_CODE="${HTTP_CODE}" python3 - <<'PY'
          import json
          import os
          import sys

          code_raw = os.environ.get("HTTP_CODE", "")
          try:
            code = int(code_raw)
          except Exception:
            print(f"Invalid HTTP code: {code_raw!r}")
            sys.exit(1)

          try:
            payload = json.load(open("/tmp/update-prices.json"))
          except Exception as exc:
            print(f"Invalid JSON response: {exc}")
            sys.exit(1)

          if code < 200 or code >= 300:
            print(f"Request failed with HTTP {code}")
            sys.exit(1)

          if not payload.get("ok"):
            print("Function returned ok=false")
            sys.exit(1)

          print("update-prices succeeded")
          PY
