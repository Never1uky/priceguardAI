# PriceGuard AI — Supabase config
# Docs: https://supabase.com/docs/guides/cli/config
#
# Внимание: `supabase config push` применяет весь файл к remote.
# Не оставляйте локальные дефолты (127.0.0.1) — они перезапишут production.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Auth
# Встроенная почта Supabase часто не доходит до Яндекс/Mail.ru.
# Confirm email выключен — регистрация сразу создаёт сессию (нужно для Chrome-расширения).
# Для надёжных писем (сброс пароля) подключите Custom SMTP: Dashboard → Authentication → SMTP.
[auth]
enabled = true
site_url = "https://supabase.com/dashboard/project/ihlfvpocwobvcpxbypsd"
additional_redirect_urls = []
enable_signup = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[storage]
enabled = true

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

# Функции включаются автоматически, если есть папка supabase/functions
# Убираем [functions] enabled = true

